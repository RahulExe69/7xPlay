name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs for the same PR/ref so commits don't queue behind obsolete builds.
concurrency:
  group: android-apks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-tests:
    name: Fast provider tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out 7xPlay
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: 7xPlay

      - name: Check out local BetterPlayer dependency
        uses: actions/checkout@v5
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          ref: claude/relaxed-dirac-tw37rj
          path: flixquest-betterplayer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Prepare ignored environment asset
        working-directory: 7xPlay
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp .env.example .env
          if [ -z "${TMDB_API_KEY//[[:space:]]/}" ]; then
            echo "::error::TMDB_API_KEY GitHub Actions secret is missing. Add it in Settings > Secrets and variables > Actions, then rerun the build."
            exit 1
          fi
          sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=${TMDB_API_KEY}|" .env
          grep -q '^TMDB_API_KEY=.' .env || { echo "::error::TMDB_API_KEY was not written to .env"; exit 1; }

      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-3.41.5-${{ hashFiles('7xPlay/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-3.41.5-

      - name: Resolve dependencies
        working-directory: 7xPlay
        run: flutter pub get

      - name: Test provider aggregation and fallback behavior
        working-directory: 7xPlay
        run: flutter test test/provider_loader_test.dart test/provider_audio_language_cache_test.dart test/offline_download_test.dart test/scraper_api_test.dart test/flixquest_api_instances_test.dart test/unified_playback_language_service_test.dart test/language_names_test.dart test/unified_playback_compile_test.dart test/preferred_audio_language_policy_test.dart test/data/scraper_cache_test.dart

  # PRs run the quick provider tests above. Avoid rebuilding all APKs on
  # every PR update; full APKs are built once after merge or on manual dispatch.
  build-apks:
    if: github.event_name != 'pull_request'
    name: Build optimized split APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out 7xPlay
        uses: actions/checkout@v5
        with:
          path: 7xPlay

      - name: Check out local BetterPlayer dependency
        uses: actions/checkout@v5
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          ref: claude/relaxed-dirac-tw37rj
          path: flixquest-betterplayer

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare ignored environment asset
        working-directory: 7xPlay
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp .env.example .env
          if [ -z "${TMDB_API_KEY//[[:space:]]/}" ]; then
            echo "::error::TMDB_API_KEY GitHub Actions secret is missing. Add it in Settings > Secrets and variables > Actions, then rerun the build."
            exit 1
          fi
          sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=${TMDB_API_KEY}|" .env
          grep -q '^TMDB_API_KEY=.' .env || { echo "::error::TMDB_API_KEY was not written to .env"; exit 1; }

      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-3.41.5-${{ hashFiles('7xPlay/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-3.41.5-

      - name: Resolve dependencies
        working-directory: 7xPlay
        run: flutter pub get

      - name: Build all optimized ABI APKs in one invocation
        working-directory: 7xPlay
        run: |
          flutter build apk --release --flavor prod --split-per-abi --obfuscate --tree-shake-icons --split-debug-info="build/symbols" --android-skip-build-dependency-validation

          APK_DIR="build/app/outputs/flutter-apk"
          mkdir -p build/artifacts/arm64-v8a build/artifacts/armeabi-v7a build/artifacts/x86_64

          ARM64_APK="$APK_DIR/app-arm64-v8a-prod-release.apk"
          ARMV7_APK="$APK_DIR/app-armeabi-v7a-prod-release.apk"
          X86_APK="$APK_DIR/app-x86_64-prod-release.apk"

          for APK in "$ARM64_APK" "$ARMV7_APK" "$X86_APK"; do
            test -s "$APK" || { echo "::error::Expected APK missing or empty: $APK"; ls -lah "$APK_DIR"; exit 1; }
          done

          cp "$ARM64_APK" build/artifacts/arm64-v8a/7xPlay-arm64-v8a-release.apk
          cp "$ARMV7_APK" build/artifacts/armeabi-v7a/7xPlay-armeabi-v7a-release.apk
          cp "$X86_APK" build/artifacts/x86_64/7xPlay-x86_64-release.apk

          echo "APK sizes:"
          du -h build/artifacts/*/*.apk
          echo "APK package IDs:"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$AAPT" ]; then
            for APK in build/artifacts/*/*.apk; do
              "$AAPT" dump badging "$APK" | grep -m1 "^package:"
            done
          else
            echo "aapt not found; APK existence and non-empty checks passed."
          fi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v5
        with:
          name: 7xPlay-arm64-v8a-release-${{ github.sha }}
          path: 7xPlay/build/artifacts/arm64-v8a/7xPlay-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v5
        with:
          name: 7xPlay-armeabi-v7a-release-${{ github.sha }}
          path: 7xPlay/build/artifacts/armeabi-v7a/7xPlay-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v5
        with:
          name: 7xPlay-x86_64-release-${{ github.sha }}
          path: 7xPlay/build/artifacts/x86_64/7xPlay-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dart symbol files
        uses: actions/upload-artifact@v5
        with:
          name: 7xPlay-symbols-${{ github.sha }}
          path: 7xPlay/build/symbols/
          if-no-files-found: warn
          retention-days: 30
