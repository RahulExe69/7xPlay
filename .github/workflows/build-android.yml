name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out 7xPlay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: 7xPlay

      - name: Check out local BetterPlayer dependency
        uses: actions/checkout@v4
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          ref: claude/relaxed-dirac-tw37rj
          path: flixquest-betterplayer

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          cache: true

      - name: Prepare ignored environment asset
        working-directory: 7xPlay
        run: cp .env.example .env

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-3.41.5-${{ hashFiles('7xPlay/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-3.41.5-

      - name: Resolve dependencies
        working-directory: 7xPlay
        run: flutter pub get

      - name: Test provider aggregation and fallback behavior
        working-directory: 7xPlay
        run: flutter test test/provider_loader_test.dart

      - name: Build optimized ABI-specific release APKs
        working-directory: 7xPlay
        run: |
          flutter build apk --release --flavor prod --split-per-abi --obfuscate --tree-shake-icons --split-debug-info=build/symbols --android-skip-build-dependency-validation
          echo "Built APK sizes:"
          find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-prod-*-release.apk' -printf '%f %k KB\n' | sort

      - name: Upload Dart symbol files
        uses: actions/upload-artifact@v4
        with:
          name: 7xPlay-dart-symbols-${{ github.event.pull_request.head.sha || github.sha }}
          path: 7xPlay/build/symbols/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: 7xPlay-release-split-apks-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            7xPlay/build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk
            7xPlay/build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk
            7xPlay/build/app/outputs/flutter-apk/app-x86_64-prod-release.apk
          if-no-files-found: error
          retention-days: 30
