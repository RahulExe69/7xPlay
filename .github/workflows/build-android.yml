name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs for the same PR/ref so commits don't queue behind obsolete builds.
concurrency:
  group: android-apks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-tests:
    name: Fast provider tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out 7xPlay
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: 7xPlay

      - name: Check out local BetterPlayer dependency
        uses: actions/checkout@v5
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          ref: claude/relaxed-dirac-tw37rj
          path: flixquest-betterplayer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Prepare ignored environment asset
        working-directory: 7xPlay
        run: cp .env.example .env

      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-3.41.5-${{ hashFiles('7xPlay/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-3.41.5-

      - name: Resolve dependencies
        working-directory: 7xPlay
        run: flutter pub get

      - name: Test provider aggregation and fallback behavior
        working-directory: 7xPlay
        run: flutter test test/provider_loader_test.dart

  build-apks:
    name: Build ${{ matrix.name }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: ARM64
            abi: arm64-v8a
            target: android-arm64
          - name: ARMv7
            abi: armeabi-v7a
            target: android-arm
          - name: x86_64
            abi: x86_64
            target: android-x64

    steps:
      - name: Check out 7xPlay
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: 7xPlay

      - name: Check out local BetterPlayer dependency
        uses: actions/checkout@v5
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          ref: claude/relaxed-dirac-tw37rj
          path: flixquest-betterplayer

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare ignored environment asset
        working-directory: 7xPlay
        run: cp .env.example .env

      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-3.41.5-${{ hashFiles('7xPlay/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-3.41.5-

      - name: Resolve dependencies
        working-directory: 7xPlay
        run: flutter pub get

      - name: Build optimized single-ABI release APK
        working-directory: 7xPlay
        env:
          ABI_TARGET: ${{ matrix.target }}
        run: |
          flutter build apk --release --flavor prod --target-platform "$ABI_TARGET" --obfuscate --tree-shake-icons --split-debug-info="build/symbols/${ABI_TARGET}" --android-skip-build-dependency-validation
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p "build/artifacts/${ABI_TARGET}"
          cp "$APK" "build/artifacts/${ABI_TARGET}/7xPlay-${{ matrix.abi }}-release.apk"
          echo "Built APK size:"
          du -h "build/artifacts/${ABI_TARGET}/7xPlay-${{ matrix.abi }}-release.apk"

      - name: Upload optimized APK
        uses: actions/upload-artifact@v5
        with:
          name: 7xPlay-${{ matrix.abi }}-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: 7xPlay/build/artifacts/${{ matrix.target }}/7xPlay-${{ matrix.abi }}-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dart symbol files
        uses: actions/upload-artifact@v5
        with:
          name: 7xPlay-symbols-${{ matrix.abi }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: 7xPlay/build/symbols/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30
