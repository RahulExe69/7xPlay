org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Keep the legacy Kotlin plugin mode until every third-party Android plugin supports AGP built-in Kotlin.
android.builtInKotlin=false
# Keep the legacy Android DSL while the current plugin graph is migrated and verified.
android.newDsl=false

# Reuse task outputs and allow independent Gradle tasks to run concurrently.
org.gradle.caching=true
org.gradle.parallel=true
